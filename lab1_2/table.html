<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>Драгоценные камушки</title>
            <meta charset="UTF-8">
        <link rel="icon" href="favicon.ico">
    </head>
    <body>
       <p>Заполните обязательные поля, чтобы добавить данные в таблицу</p>
        <br>
        Тип камушков:
       <select>
        <option>сапфиры</option>
        <option>рубины</option>
        <option>алмазы</option>
       </select>
       <br>
        Год:
       <input type="date"/>✅
       <br>
        Количество:
        <input type="number"/>❌
        <br>
        <button type="submit">Отправить</button>
        <table width="100%" border="1">
            <caption>Добыча драгоценных камней</caption>
            <tr>
                <th>Камушек</th>
                <th colspan="3">Год</th>
            </tr>
            <tr>
                <th></th>
                <th>2010</th>
                <th>2012</th>
                <th>2014</th>
            </tr>
            <tr>
                <td>Сапфиры</td>
                <td rowspan="2">1483</td>
                <td>4532</td>
                <td>6743</td>
            </tr>
        </table>
       
    </body>
</html>
